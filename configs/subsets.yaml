defaults:
  - paths: default
  - _self_

val_ids: splits/val_ids.txt
# {val,test}_{title_seen,title_unseen,no_class_name}.txt, committed to git.
out_dir: splits
report: outputs/subsets/report.json
# Hash every image to find byte-identical copies across splits (reads ~8 GB once).
check_images: true

hydra:
  run:
    dir: outputs/subsets/${now:%Y-%m-%d}/${now:%H-%M-%S}
