# @package _global_

defaults:
  - /paths: default
  - _self_

encoder: vit_b_16_swag
val_ids: splits/val_ids.txt
checkpoint_dir: outputs/ckpt/image_mlp
preds_dir: outputs/preds

train:
  device: auto
  seeds: [0, 1, 2]
  # Verify these optimization settings against the full course protocol 2.4.
  batch_size: 256
  epochs: 100
  patience: 10
  learning_rate: 0.001
  weight_decay: 0.0001

hydra:
  run:
    dir: outputs/train-image-mlp/${now:%Y-%m-%d}/${now:%H-%M-%S}
