defaults:
  - paths: default
  - _self_

# val for model selection; test only for the final table.
split: val
val_ids: splits/val_ids.txt
preds_dir: outputs/preds
results_dir: outputs/results
# Extra subsets reported next to "all": name -> file of image ids, one per line.
# Written by `just make-subsets`; `subsets=null` scores "all" only.
subsets:
  title_seen: splits/${split}_title_seen.txt
  title_unseen: splits/${split}_title_unseen.txt
  no_class_name: splits/${split}_no_class_name.txt
  image_unseen: splits/${split}_image_unseen.txt
  unseen: splits/${split}_unseen.txt

hydra:
  run:
    dir: outputs/evaluate/${now:%Y-%m-%d}/${now:%H-%M-%S}
